<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08111f">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>USB Camera Studio</title>

  <style>
    :root {
      --bg: #070a14;
      --panel: #11182a;
      --panel-2: #18233b;
      --line: #293653;
      --text: #f5f7ff;
      --muted: #9aa7c1;
      --brand: #5b8cff;
      --brand-2: #8a6cff;
      --green: #36d7a2;
      --danger: #ff6d7a;
      --warning: #ffca68;
      --shadow: 0 20px 60px rgba(0,0,0,.34);
    }

    body.light {
      --bg: #edf2fb;
      --panel: #ffffff;
      --panel-2: #e8eef9;
      --line: #d4deee;
      --text: #17243e;
      --muted: #5d6c83;
      --shadow: 0 16px 42px rgba(43,65,105,.14);
      background:
        radial-gradient(
          circle at 78% -8%,
          rgba(106,139,235,.25) 0,
          transparent 32%
        ),
        #edf2fb;
    }

    body.light::before {
      opacity: .07;
    }

    body.light aside {
      background: rgba(255,255,255,.82);
      border-color: #d6e0ef;
    }

    body.light .card {
      background: linear-gradient(145deg,#fff,#f5f8fd);
      border-color: #d4deee;
    }

    body.light .hero {
      background: linear-gradient(105deg,#dbe8ff,#e8e7ff 52%,#e7e2ff);
      border-color: #c3d2ec;
    }

    body.light .hero p,
    body.light .hero-stat small {
      color: #53647f;
    }

    body.light .hero-stat,
    body.light .metric,
    body.light .feature {
      background: rgba(255,255,255,.58);
      border-color: #cfdaeb;
    }

    body.light .preview,
    body.light video {
      background: #dce7f5;
    }

    body.light input,
    body.light select {
      background: #f6f9fd;
      border-color: #cbd7e9;
      color: var(--text);
    }

    body.light .btn {
      background: #e4ebf8;
      border-color: #c6d4e9;
      color: var(--text);
    }

    body.light .btn.primary {
      color: #fff;
      background: linear-gradient(135deg,#4a79e8,#735de0);
    }

    body.light .status {
      background: #f7faff;
      border-color: #cbd7e9;
    }

    body.light .side-note {
      background: #f5f8fd;
      border-color: #d2ddeb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(
          circle at 78% -8%,
          rgba(74,93,190,.42) 0,
          transparent 32%
        ),
        radial-gradient(
          circle at 12% 85%,
          rgba(37,93,170,.18) 0,
          transparent 30%
        ),
        var(--bg);
      font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .13;
      background-image:
        linear-gradient(
          rgba(255,255,255,.06) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.06) 1px,
          transparent 1px
        );
      background-size: 54px 54px;
      mask-image: linear-gradient(to bottom,black,transparent 78%);
    }

    /* Capa de abertura inspirada na referência enviada */
    .splash-screen {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #030303;
      transition: opacity .45s ease, visibility .45s ease;
    }

    .splash-screen::before {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255,166,0,.12),
        transparent 68%
      );
      filter: blur(8px);
    }

    .splash-screen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-content {
      position: relative;
      z-index: 1;
      text-align: center;
      animation: splashUp .7s ease both;
    }

    .splash-logo {
      display: grid;
      place-items: center;
      width: 124px;
      height: 124px;
      margin: 0 auto 22px;
      border-radius: 34px;
      color: #fff;
      background: linear-gradient(
        145deg,
        #ffb51b 0%,
        #f49600 72%,
        #e77e00 100%
      );
      box-shadow:
        0 19px 48px rgba(245,145,0,.29),
        inset 0 1px 0 rgba(255,255,255,.2);
    }

    .splash-logo svg {
      width: 78px;
      height: 78px;
      display: block;
    }

    .splash-content h2 {
      margin: 0;
      color: #fff;
      font-size: 29px;
      font-weight: 800;
      letter-spacing: -.8px;
    }

    .splash-content p {
      margin: 7px 0 20px;
      color: #a7a7a7;
      font-size: 12px;
    }

    .splash-progress {
      width: 160px;
      height: 3px;
      margin: auto;
      overflow: hidden;
      border-radius: 9px;
      background: #302512;
    }

    .splash-progress i {
      display: block;
      width: 46%;
      height: 100%;
      border-radius: 9px;
      background: #ffac12;
      animation: splashLoad 1.15s ease-in-out infinite;
    }

    @keyframes splashUp {
      from {
        opacity: 0;
        transform: translateY(10px) scale(.97);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes splashLoad {
      0% {
        transform: translateX(-120%);
      }

      100% {
        transform: translateX(350%);
      }
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      color: var(--text);
    }

    .app {
      display: grid;
      grid-template-columns: 232px 1fr;
      min-height: 100vh;
      position: relative;
    }

    aside {
      padding: 25px 15px;
      border-right: 1px solid rgba(101,125,185,.18);
      background: rgba(7,10,20,.78);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 10px 28px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: linear-gradient(145deg,#ffb51b,#ed8d00);
      box-shadow: 0 8px 25px rgba(245,145,0,.25);
      color: #fff;
    }

    .brand-mark svg {
      width: 28px;
      height: 28px;
      display: block;
    }

    .brand strong {
      font-size: 16px;
      letter-spacing: .2px;
    }

    .brand small {
      display: block;
      color: var(--muted);
      font-size: 11px;
    }

    nav {
      display: grid;
      gap: 7px;
    }

    nav button {
      text-align: left;
      padding: 13px 14px;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      border-left: 3px solid transparent;
    }

    nav button:hover,
    nav button.active {
      background: linear-gradient(
        90deg,
        rgba(91,140,255,.2),
        rgba(91,140,255,.03)
      );
      color: var(--text);
      border-left-color: var(--brand);
    }

    .side-note {
      margin: 30px 8px 0;
      padding: 14px;
      border: 1px solid rgba(91,140,255,.2);
      border-radius: 10px;
      color: var(--muted);
      font-size: 12px;
      background: rgba(17,24,42,.55);
    }

    .side-note strong {
      color: var(--text);
      display: block;
      margin-bottom: 5px;
    }

    main {
      width: min(1480px, 100%);
      padding: 30px clamp(18px, 4vw, 52px) 46px;
      margin: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px,3vw,36px);
      letter-spacing: -1px;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
    }

    .hero {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      min-height: 178px;
      margin: 0 0 22px;
      padding: 28px 31px;
      overflow: hidden;
      border: 1px solid rgba(105,132,211,.28);
      border-radius: 12px;
      background: linear-gradient(
        105deg,
        rgba(29,47,91,.98),
        rgba(27,38,78,.78) 50%,
        rgba(55,53,125,.88)
      );
      box-shadow: var(--shadow);
    }

    .hero::after {
      content: "◉";
      position: absolute;
      right: 9%;
      top: -62px;
      color: rgba(141,158,255,.12);
      font-size: 270px;
      font-weight: 900;
      transform: rotate(-18deg);
    }

    .hero-copy {
      position: relative;
      z-index: 1;
      max-width: 600px;
    }

    .eyebrow {
      color: #a9c4ff;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 11px;
      font-weight: 800;
    }

    .hero h2 {
      margin: 7px 0 6px;
      font-size: clamp(22px,3vw,32px);
      letter-spacing: -.7px;
    }

    .hero p {
      margin: 0;
      color: #c1cbe2;
      max-width: 510px;
    }

    .hero-actions {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }

    .hero-stats {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 10px;
    }

    .hero-stat {
      min-width: 82px;
      padding: 12px;
      border: 1px solid rgba(196,210,255,.18);
      border-radius: 9px;
      background: rgba(7,10,22,.26);
    }

    .hero-stat strong {
      display: block;
      font-size: 18px;
    }

    .hero-stat small {
      color: #b8c4df;
      font-size: 10px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(14,28,48,.75);
      font-size: 13px;
    }

    .secure-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 9px 12px;
      border: 1px solid rgba(54,215,162,.3);
      border-radius: 999px;
      color: #8ce7ca;
      background: rgba(54,215,162,.07);
      font-size: 12px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 0 4px rgba(255,109,122,.1);
    }

    .dot.ok {
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(54,215,162,.1);
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(300px, .75fr);
      gap: 18px;
    }

    .card {
      background: linear-gradient(
        145deg,
        rgba(18,25,45,.96),
        rgba(12,17,31,.96)
      );
      border: 1px solid rgba(105,128,181,.22);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 17px 19px;
      border-bottom: 1px solid rgba(105,128,181,.18);
    }

    .card:hover {
      border-color: rgba(91,140,255,.42);
    }

    .card-head h2 {
      margin: 0;
      font-size: 15px;
    }

    .card-head span {
      color: var(--muted);
      font-size: 12px;
    }

    .preview {
      position: relative;
      min-height: 390px;
      overflow: hidden;
      background: radial-gradient(
        circle at center,
        #162746,
        #050811 72%
      );
      border-radius: 12px 12px 0 0;
    }

    video {
      display: block;
      width: 100%;
      height: 390px;
      object-fit: contain;
      background: #050811;
      transform-origin: center;
    }

    .empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 30px;
      color: var(--muted);
      pointer-events: none;
    }

    .empty .camera-icon {
      font-size: 45px;
      margin-bottom: 10px;
    }

    .overlay {
      position: absolute;
      left: 16px;
      right: 16px;
      top: 14px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #fff;
      font-size: 12px;
      text-shadow: 0 2px 7px #000;
      pointer-events: none;
    }

    .overlay .right {
      text-align: right;
    }

    .rec {
      color: #ff7a84;
      font-weight: 700;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      padding: 15px 17px;
      border-top: 1px solid var(--line);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 10px 14px;
      border-radius: 7px;
      background: #1a2744;
      color: var(--text);
      border: 1px solid #324870;
      transition: .18s;
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.14);
      box-shadow: 0 7px 20px rgba(62,106,202,.18);
    }

    .btn.primary {
      background: linear-gradient(135deg,#4a79e8,#735de0);
      border-color: transparent;
    }

    .btn.danger {
      background: rgba(255,109,122,.13);
      color: #ffabb3;
      border-color: rgba(255,109,122,.35);
    }

    .btn.ghost {
      background: transparent;
      color: var(--muted);
    }

    .btn:disabled {
      opacity: .42;
      cursor: not-allowed;
      transform: none;
    }

    .side {
      display: grid;
      gap: 18px;
      align-content: start;
    }

    .form {
      padding: 18px;
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    input,
    select {
      width: 100%;
      padding: 10px 11px;
      color: var(--text);
      background: #0b1121;
      border: 1px solid #2c3d60;
      border-radius: 7px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(91,140,255,.12);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--text);
      font-size: 13px;
    }

    .check input {
      width: auto;
      accent-color: var(--brand);
    }

    .switch {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .switch small {
      display: block;
      color: var(--muted);
      margin-top: 2px;
    }

    .switch input {
      width: auto;
      accent-color: var(--brand);
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 9px;
      padding: 0 18px 18px;
    }

    .metric {
      padding: 12px;
      border: 1px solid rgba(105,128,181,.22);
      border-radius: 8px;
      background: rgba(7,11,23,.48);
    }

    .metric small {
      color: var(--muted);
      display: block;
      font-size: 11px;
    }

    .metric strong {
      display: block;
      margin-top: 3px;
      font-size: 17px;
    }

    .wide {
      grid-column: 1 / -1;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 10px;
      padding: 18px;
    }

    .feature {
      padding: 16px;
      border: 1px solid rgba(105,128,181,.22);
      border-radius: 9px;
      background: linear-gradient(
        145deg,
        rgba(24,36,64,.72),
        rgba(10,15,28,.72)
      );
      transition: .18s;
    }

    .feature:hover {
      transform: translateY(-2px);
      border-color: rgba(91,140,255,.5);
    }

    .feature b {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
    }

    .feature p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .note {
      margin: 0 18px 18px;
      padding: 12px 13px;
      color: #c7d7e9;
      font-size: 12px;
      border-left: 3px solid var(--warning);
      background: rgba(255,202,104,.07);
      border-radius: 6px;
    }

    .devices {
      display: flex;
      gap: 9px;
      align-items: center;
    }

    .devices select {
      min-width: 180px;
    }

    .hidden {
      display: none !important;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 18px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 13px 0;
      border-bottom: 1px solid rgba(105,128,181,.18);
    }

    .setting-row:last-child {
      border-bottom: 0;
    }

    .setting-row strong {
      display: block;
      font-size: 13px;
      color: var(--text);
    }

    .setting-row small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .setting-row select {
      width: 170px;
      flex: none;
    }

    .setting-row input[type="checkbox"] {
 8M31 38v20"

            stroke="currentColor"

            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="31" cy="48" r="4" fill="currentColor"/>
        </svg>
      </div>

      <h2>USB Camera</h2>
      <p>Studio local para captura UVC</p>

      <div class="splash-progress">
        <i></i>
      </div>
    </div>
  </div>

  <div class="app">
    <aside>
      <div class="brand">
        <div class="brand-mark" aria-label="USB Camera">
          <svg viewBox="0 0 96 96" aria-hidden="true">
            <path
              d="M14 31h33l13-9h12c5 0 9 4 9 9v34c[05-49-99](05-49-99)H60L47 65H14c-[30-5-2-5-5](30-5-2-5-5)V36c[0-32-55-5](0-32-55-5)Z"
              fill="none"
              stroke="currentColor"
              stroke-width="6"
              stroke-linejoin="round"
            />
            <path
              d="M47 38v20m[0-20-8-8](0-20-8-8)m8 8 8-8m-[820-88](820-88)m8-8 8 8M31 38v20"
              fill="none"
              stroke="currentColor"
              stroke-width="6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle cx="31" cy="48" r="4" fill="currentColor"/>
          </svg>
        </div>

        <div>
          <strong>USB Camera</strong>
          <small>Studio local</small>
        </div>
      </div>

      <nav aria-label="Navegação">
        <button class="active" data-section="dashboard">▦ Painel</button>
        <button data-section="stream">◉ Transmissão</button>
        <button data-section="recording">● Gravação</button>
        <button data-section="about">ⓘ Compatibilidade</button>
        <button data-section="settings">⚙ Configurações</button>
      </nav>

      <div class="side-note">
        <strong>Protótipo web</strong>
        Use uma webcam ou uma EasyCap reconhecida pelo navegador.
        Recursos RTSP/RTMP precisam de um servidor de transmissão.
      </div>
    </aside>

    <main>
      <section id="dashboard" class="section active">
        <header>
          <div>
            <h1>Painel da câmera</h1>
            <p class="subtitle">
              Capture, grave e monitore seus dispositivos UVC.
            </p>
          </div>

          <div class="header-actions">
            <div class="secure-badge">🔒 Proteção ativa</div>

            <div class="status">
              <i class="dot" id="statusDot"></i>
              <span id="statusText">Nenhum dispositivo conectado</span>
            </div>

            <button class="btn primary" id="connectBtn">
              ⌁ Conectar dispositivo
            </button>
          </div>
        </header>

        <div class="hero">
          <div class="hero-copy">
            <div class="eyebrow">USB CAMERA · STUDIO</div>

            <h2>Seu centro de captura.</h2>

            <p>
              Conecte uma câmera UVC ou EasyCap, visualize em tempo real
              e grave com controle profissional.
            </p>

            <div class="hero-actions">
              <button class="btn primary" id="heroConnectBtn">
                ⌁ Conectar agora
              </button>

              <button class="btn" data-section-jump="about">
                Ver compatibilidade
              </button>
            </div>
          </div>

          <div class="hero-stats">
            <div class="hero-stat">
              <strong>4K</strong>
              <small>captura compatível</small>
            </div>

            <div class="hero-stat">
              <strong>UVC</strong>
              <small>plug &amp; play</small>
            </div>

            <div class="hero-stat">
              <strong>24/7</strong>
              <small>gravação em loop</small>
            </div>
          </div>
