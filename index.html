<script>
  const $ = (s) => document.querySelector(s);

  let stream = null;
  let recorder = null;
  let chunks = [];
  let lastBlob = null;
  let lastMime = 'video/webm';
  let lastExtension = 'webm';
  let browserDirectory = null;
  let timerInterval = null;
  let startedAt = 0;
  let motionTimer = null;
  let previousFrame = null;

  const video = $('#preview');
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', {willReadFrequently:true});

  function toast(message) {
    const el = $('#toast');
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(toast.t);
    toast.t = setTimeout(() => el.classList.remove('show'), 3600);
  }

  function setConnected(connected) {
    $('#statusDot').classList.toggle('ok', connected);
    $('#statusText').textContent = connected
      ? 'Dispositivo conectado'
      : 'Nenhum dispositivo conectado';

    $('#emptyState').classList.toggle('hidden', connected);

    ['recordBtn','shotBtn','pipBtn','fullBtn'].forEach(id => {
      $('#' + id).disabled = !connected;
    });
  }

  function formatTime(seconds) {
    const h = String(Math.floor(seconds / 3600)).padStart(2,'0');
    const m = String(Math.floor((seconds % 3600) / 60)).padStart(2,'0');
    const s = String(Math.floor(seconds % 60)).padStart(2,'0');

    return `\({h}:\){m}:${s}`;
  }

  function updateOverlay() {
    let left = 'USB CAMERA';

    if ($('#timestamp').checked) {
      left += ' · ' + new Date().toLocaleString('pt-BR');
    }

    $('#overlayLeft').textContent = left;

    let info = '';

    if ($('#gpsOverlay').checked) {
      info = `\({\)('#gpsText').value || 'GPS indisponível'} · \({\)('#speed').value || 0} km/h`;
    }

    $('#overlayInfo').textContent = info;
  }

  function getFieldValue(selector, fallback) {
    const field = $(selector);

    return field && field.value !== undefined
      ? field.value
      : fallback;
  }

  function isFieldChecked(selector) {
    const field = $(selector);
    return !!(field && field.checked);
  }

  function applyImageFilters() {
    const brightness = Number(getFieldValue('#brightnessRange',100));
    const contrast = Number(getFieldValue('#contrastRange',100));
    const saturation = Number(getFieldValue('#saturationRange',100));
    const sharpness = Number(getFieldValue('#sharpnessRange',0));
    const whiteBalance = Number(getFieldValue('#whiteBalanceRange',50));
    const exposure = Number(getFieldValue('#exposureRange',100));
    const antiAliasing = isFieldChecked('#antiAliasing');
    const aaBlur = antiAliasing
      ? Number(getFieldValue('#antiAliasingLevel',0.5))
      : 0;

    const warmth = Math.abs(whiteBalance - 50) * .28;
    const hue = (whiteBalance - 50) * .72;
    const enhancedContrast = contrast + sharpness * .18;
    const finalBrightness = brightness * exposure / 100;

    video.style.filter =
      `brightness(\({finalBrightness}%) contrast(\){enhancedContrast}%) saturate(\({saturation}%) sepia(\){warmth}%) hue-rotate(\({hue}deg) blur(\){aaBlur}px)`;

    if ($('#brightnessValue')) {
      $('#brightnessValue').textContent = brightness + '%';
    }

    if ($('#contrastValue')) {
      $('#contrastValue').textContent = contrast + '%';
    }

    if ($('#saturationValue')) {
      $('#saturationValue').textContent = saturation + '%';
    }

    if ($('#sharpnessValue')) {
      $('#sharpnessValue').textContent = sharpness + '%';
    }

    if ($('#whiteBalanceValue')) {
      $('#whiteBalanceValue').textContent = whiteBalance + '%';
    }

    if ($('#exposureValue')) {
      $('#exposureValue').textContent = exposure + '%';
    }
  }

  function showError(message) {
    toast(message);
  }

  async function listDevices() {
    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.enumerateDevices
    ) {
      return;
    }

    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const cameras = devices.filter(d => d.kind === 'videoinput');
      const select = $('#deviceSelect');

      select.innerHTML = cameras.length
        ? ''
        : '<option value="">Nenhuma câmera encontrada</option>';

      cameras.forEach((d,i) => {
        const option = document.createElement('option');

        option.value = d.deviceId;
        option.textContent = d.label || `Câmera USB ${i + 1}`;

        select.appendChild(option);
      });
    } catch(e) {
      showError('Não foi possível listar os dispositivos.');
    }
  }

  async function applyVideoSettings() {
    if (!stream) {
      toast('As configurações serão aplicadas ao conectar.');
      return;
    }

    const [w,h] = $('#resolution').value.split('x').map(Number);
    const fps = Number($('#frameRate').value || 30);
    const track = stream.getVideoTracks()[0];

    try {
      if (track.applyConstraints) {
        await track.applyConstraints({
          width:{ideal:w},
          height:{ideal:h},
          frameRate:{ideal:fps, max:fps}
        });
      }

      const settings = track.getSettings();

      $('#overlayInfo').textContent =
        `\({settings.width || w}×\){settings.height || h} · ${settings.frameRate ? Math.round(settings.frameRate) : fps} FPS`;

      toast('Qualidade aplicada em tempo real.');
    } catch(e) {
      toast('O dispositivo não aceitou a alteração ao vivo; reconectando.');
      await connect($('#deviceSelect').value);
    }
  }

  async function connect(deviceId) {
    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {
      showError(
        'Este navegador não oferece acesso à câmera. Abra em HTTPS ou localhost.'
      );
      return;
    }

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }

    const [w,h] = $('#resolution').value.split('x').map(Number);

    try {
      const fps = Number(getFieldValue('#frameRate',30));

      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          deviceId: deviceId ? {exact:deviceId} : undefined,
          width:{ideal:w},
          height:{ideal:h},
          frameRate:{ideal:fps, max:fps}
        },
        audio: $('#audioDefault')
          ? $('#audioDefault').checked
          : true
      });

      video.srcObject = stream;

      setConnected(true);
      await listDevices();

      const active = stream.getVideoTracks()[0];
      const settings = active.getSettings();

      $('#overlayInfo').textContent =
        `\({settings.width || w}×\){settings.height || h} · ${settings.frameRate ? Math.round(settings.frameRate) : fps} FPS`;

      toast('Dispositivo conectado com sucesso.');
    } catch(e) {
      setConnected(false);

      showError(
        'Não foi possível acessar a câmera. Verifique a permissão, o cabo OTG e a alimentação.'
      );
    }
  }

  $('#connectBtn').onclick = () => {
    connect($('#deviceSelect').value);
  };

  $('#refreshBtn').onclick = listDevices;

  $('#deviceSelect').onchange = () => {
    if (stream) {
      connect($('#deviceSelect').value);
    }
  };

  $('#resolution').onchange = applyVideoSettings;
  $('#frameRate').onchange = applyVideoSettings;

  function startTimer() {
    startedAt = Date.now();

    clearInterval(timerInterval);

    timerInterval = setInterval(() => {
      $('#timer').textContent =
        formatTime((Date.now() - startedAt) / 1000);
    }, 500);
  }

  function stopTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
  }

  function beginRecording() {
    if (!stream) {
      return showError('Conecte uma câmera antes de gravar.');
    }

    if ((recorder && recorder.state) === 'recording') {
      return;
    }

    const requestedFormat = getFieldValue('#format','webm');
    const quality = Number(getFieldValue('#quality',5000000));

    const mp4Types = [
      'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
      'video/mp4'
    ];

    const webmTypes = [
      'video/webm;codecs=vp9,opus',
      'video/webm;codecs=vp8,opus',
      'video/webm'
    ];

    const candidates = requestedFormat === 'mp4'
      ? mp4Types.concat(webmTypes)
      : webmTypes;

    const mime =
      candidates.find(type => MediaRecorder.isTypeSupported(type)) || '';

    if (
      requestedFormat === 'mp4' &&
      mime &&
      !mime.startsWith('video/mp4')
    ) {
      toast('MP4 não é suportado neste aparelho; usando WebM compatível.');
    }

    try {
      recorder = new MediaRecorder(
        stream,
        mime
          ? {
              mimeType:mime,
              videoBitsPerSecond:quality,
              audioBitsPerSecond:128000
            }
          : {
              videoBitsPerSecond:quality,
              audioBitsPerSecond:128000
            }
      );
    } catch(e) {
      return showError(
        'Este navegador não suporta gravação neste formato.'
      );
    }

    chunks = [];

    recorder.ondataavailable = event => {
      if (event.data.size) {
        chunks.push(event.data);
      }
    };

    recorder.onstop = () => {
      lastMime = recorder.mimeType || 'video/webm';
      lastExtension = lastMime.startsWith('video/mp4')
        ? 'mp4'
        : 'webm';

      lastBlob = new Blob(chunks, {type:lastMime});

      const mb = (lastBlob.size / 1048576).toFixed(1);

      $('#lastFile').textContent =
        `Gravação pronta · \({lastExtension.toUpperCase()} · \){mb} MB`;

      $('#downloadBtn').disabled = false;
      $('#downloadBtn2').disabled = false;

      toast('Gravação finalizada e pronta para baixar.');
    };

    recorder.start(1000);

    $('#recordBtn').textContent = '■ Parar gravação';
    $('#recordBtn').classList.add('danger');
    $('#metricState').textContent = 'Gravando';
    $('#recordIndicator').textContent = '● REC';

    startTimer();
  }

  function finishRecording() {
    if (!recorder || recorder.state === 'inactive') {
      return;
    }

    recorder.stop();

    $('#recordBtn').textContent = '● Iniciar gravação';
    $('#recordBtn').classList.remove('danger');
    $('#metricState').textContent = 'Parado';
    $('#recordIndicator').textContent = '';

    stopTimer();
  }

  $('#recordBtn').onclick = () => {
    if ((recorder && recorder.state) === 'recording') {
      finishRecording();
    } else {
      beginRecording();
    }
  };

  $('#recordFromPage').onclick = () => {
    document
      .querySelector('[data-section="dashboard"]')
      .click();

    beginRecording();
  };

  function localDateFolder() {
    const date = new Date();

    return date.getFullYear() + '-' +
      String(date.getMonth() + 1).padStart(2,'0') + '-' +
      String(date.getDate()).padStart(2,'0');
  }

  function updateFolderStatus() {
    const androidFolder = !!(
      window.Android &&
      Android.hasSaveFolder &&
      Android.hasSaveFolder()
    );

    const enabled = androidFolder || !!browserDirectory;

    if ($('#folderStatus')) {
      $('#folderStatus').textContent = enabled
        ? (
            $('#dateFolders').checked
              ? 'Pasta autorizada: novas gravações serão organizadas por data.'
              : 'Pasta autorizada: novas gravações serão salvas nela.'
          )
        : 'As gravações serão baixadas pelo navegador.';
    }
  }

  async function blobBytes(blob) {
    if (blob.arrayBuffer) {
      return new Uint8Array(await blob.arrayBuffer());
    }

    return new Uint8Array(
      await new Promise(resolve => {
        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);
        reader.readAsArrayBuffer(blob);
      })
    );
  }

  async function saveInBrowserFolder(filename) {
    if (!browserDirectory) {
      return false;
    }

    try {
      const target = $('#dateFolders').checked
        ? await browserDirectory.getDirectoryHandle(
            localDateFolder(),
            {create:true}
          )
        : browserDirectory;

      const file = await target.getFileHandle(
        filename,
        {create:true}
      );

      const writable = await file.createWritable();

      await writable.write(lastBlob);
      await writable.close();

      return true;
    } catch(e) {
      return false;
    }
  }

  async function saveLastToFolder(filename) {
    if (!window.Android && browserDirectory) {
      return saveInBrowserFolder(filename);
    }

    const bridge = window.Android;

    if (!bridge) {
      return false;
    }

    const starter = $('#dateFolders').checked &&
      bridge.startFileInDateFolder
        ? bridge.startFileInDateFolder
        : bridge.startFile;

    if (
      !starter ||
      !bridge.appendFileChunk ||
      !bridge.finishFile ||
      !starter(filename)
    ) {
      return false;
    }

    try {
      const bytes = await blobBytes(lastBlob);
      const size = 480000;

      for (let offset = 0; offset < bytes.length; offset += size) {
        let binary = '';
        const end = Math.min(offset + size, bytes.length);

        for (let i = offset; i < end; i++) {
          binary += String.fromCharCode(bytes[i]);
        }

        if (!bridge.appendFileChunk(btoa(binary))) {
          throw new Error('chunk');
        }
      }

      return bridge.finishFile();
    } catch(e) {
      if (bridge.cancelFile) {
        bridge.cancelFile();
      }

      return false;
    }
  }

  async function downloadLast() {
    if (!lastBlob) {
      return;
    }

    const filename =
      ($('#filename').value || 'usb-camera-gravacao') +
      '.' +
      lastExtension;

    const androidFolder = !!(
      window.Android &&
      Android.hasSaveFolder &&
      Android.hasSaveFolder()
    );

    if (androidFolder || browserDirectory) {
      if (await saveLastToFolder(filename)) {
        toast('Gravação salva na pasta escolhida.');
        return;
      }

      toast(
        'Não foi possível salvar na pasta; iniciando o download normal.'
      );
    }

    const link = document.createElement('a');

    link.href = URL.createObjectURL(lastBlob);
    link.download = filename;
    link.click();

    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  }

  $('#downloadBtn').onclick = downloadLast;
  $('#downloadBtn2').onclick = downloadLast;

  $('#shotBtn').onclick = () => {
    if (!stream) {
      return;
    }

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(video,0,0);

    const link = document.createElement('a');

    link.href = canvas.toDataURL('image/png');
    link.download = 'usb-camera-foto.png';
    link.click();

    toast('Foto capturada.');
  };

  $('#pipBtn').onclick = async () => {
    try {
      await video.requestPictureInPicture();
    } catch(e) {
      showError(
        'Picture-in-Picture não está disponível neste navegador.'
      );
    }
  };

  $('#fullBtn').onclick = () => {
    if (video.requestFullscreen) {
      video.requestFullscreen();
    }
  };

  $('#mirror').onchange = event => {
    video.style.transform = event.target.checked
      ? 'scaleX(-1)'
      : '';
  };

  ['timestamp','gpsOverlay','speed'].forEach(id => {
    $('#' + id).addEventListener('input', updateOverlay);
  });

  $('#gpsBtn').onclick = () => {
    if (!navigator.geolocation) {
      return showError(
        'Este navegador não oferece localização.'
      );
    }

    navigator.geolocation.getCurrentPosition(
      position => {
        const {
          latitude,
          longitude,
          speed
        } = position.coords;

        $('#gpsText').value =
          `\({latitude.toFixed(5)}, \){longitude.toFixed(5)}`;

        if (speed != null) {
          $('#speed').value =
            Math.max(0, (speed * 3.6).toFixed(1));
        }

        updateOverlay();
        toast('Localização obtida.');
      },
      () => showError(
        'Permita o acesso à localização para usar o GPS.'
      )
    );
  };

  function motionCheck() {
    if (!stream || video.readyState < 2) {
      return;
    }

    canvas.width = 160;
    canvas.height = 90;

    ctx.drawImage(video,0,0,160,90);

    const data =
      ctx.getImageData(0,0,160,90).data;

    if (previousFrame) {
      let changed = 0;

      for (let i = 0; i < data.length; i += 16) {
        changed +=
          Math.abs(data[i] - previousFrame[i]) +
          Math.abs(data[i + 1] - previousFrame[i + 1]) +
          Math.abs(data[i + 2] - previousFrame[i + 2]);
      }

      const movement =
        changed / (data.length / 16);

      if (
        movement > 28 &&
        (recorder && recorder.state) !== 'recording'
      ) {
        beginRecording();
      }
    }

    previousFrame = data;
  }

  $('#motion').onchange = event => {
    $('#motionState').textContent =
      event.target.checked
        ? 'Ativa'
        : 'Desligada';

    clearInterval(motionTimer);

    if (event.target.checked) {
      motionTimer = setInterval(motionCheck,700);
    }
  };

  document.querySelectorAll('nav button').forEach(button => {
    button.onclick = () => {
      document.querySelectorAll('nav button').forEach(item => {
        item.classList.remove('active');
      });

      button.classList.add('active');

      document.querySelectorAll('.section').forEach(section => {
        section.classList.remove('active');
      });

      $('#' + button.dataset.section).classList.add('active');
    };
  });

  $('#heroConnectBtn').onclick = () => {
    connect($('#deviceSelect').value);
  };

  document
    .querySelectorAll('[data-section-jump]')
    .forEach(button => {
      button.onclick = () => {
        document
          .querySelector(
            '[data-section="' + button.dataset.sectionJump + '"]'
          )
          .click();
      };
    });

  function settingGet(key, fallback) {
    try {
      const value = localStorage.getItem(key);

      return value === null
        ? fallback
        : JSON.parse(value);
    } catch(e) {
      return fallback;
    }
  }

  function settingSet(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch(e) {}
  }

  function applyTheme(theme) {
    const chosen = theme === 'system'
      ? (
          window.matchMedia &&
          matchMedia('(prefers-color-scheme:light)').matches
            ? 'light'
            : 'dark'
        )
      : theme;

    document.body.classList.toggle(
      'light',
      chosen === 'light'
    );
  }

  function loadSettings() {
    const theme = settingGet('usbCameraTheme','dark');

    $('#themeSelect').value = theme;
    applyTheme(theme);

    $('#splashToggle').checked =
      settingGet('usbCameraSplash',true);

    $('#reduceMotion').checked =
      settingGet('usbCameraReduceMotion',false);

    $('#timestampDefault').checked =
      settingGet('usbCameraTimestamp',true);

    $('#audioDefault').checked =
      settingGet('usbCameraAudio',true);

    $('#motionDefault').checked =
      settingGet('usbCameraMotion',false);

    $('#resolutionDefault').value =
      settingGet('usbCameraResolution','1920x1080');

    $('#frameRateDefault').value =
      settingGet('usbCameraFrameRate','30');

    $('#formatDefault').value =
      settingGet('usbCameraFormat','webm');

    $('#qualityDefault').value =
      settingGet('usbCameraQuality','5000000');

    $('#dateFolders').checked =
      settingGet('usbCameraDateFolders',false);

    $('#brightnessRange').value =
      settingGet('usbCameraBrightness',100);

    $('#contrastRange').value =
      settingGet('usbCameraContrast',100);

    $('#saturationRange').value =
      settingGet('usbCameraSaturation',100);

    $('#sharpnessRange').value =
      settingGet('usbCameraSharpness',0);

    $('#whiteBalanceRange').value =
      settingGet('usbCameraWhiteBalance',50);

    $('#exposureRange').value =
      settingGet('usbCameraExposure',100);

    $('#antiAliasing').checked =
      settingGet('usbCameraAntiAliasing',false);

    $('#antiAliasingLevel').value =
      settingGet('usbCameraAaLevel','0.5');

    applyImageFilters();

    $('#timestamp').checked =
      $('#timestampDefault').checked;

    $('#resolution').value =
      $('#resolutionDefault').value;

    $('#frameRate').value =
      $('#frameRateDefault').value;

    $('#format').value =
      $('#formatDefault').value;

    $('#quality').value =
      $('#qualityDefault').value;

    $('#motion').checked =
      $('#motionDefault').checked;

    $('#motion').dispatchEvent(new Event('change'));

    if ($('#reduceMotion').checked) {
      document.body.classList.add('reduce-motion');
    }

    if ($('#splashToggle').checked) {
      window.setTimeout(
        () => $('#splashScreen').classList.add('hide'),
        1250
      );
    } else {
      $('#splashScreen').classList.add('hide');
    }
  }

  $('#themeSelect').onchange = event => {
    settingSet('usbCameraTheme',event.target.value);
    applyTheme(event.target.value);
  };

  $('#splashToggle').onchange = event => {
    settingSet('usbCameraSplash',event.target.checked);
  };

  $('#reduceMotion').onchange = event => {
    settingSet(
      'usbCameraReduceMotion',
      event.target.checked
    );

    document.body.classList.toggle(
      'reduce-motion',
      event.target.checked
    );
  };

  $('#timestampDefault').onchange = event => {
    settingSet(
      'usbCameraTimestamp',
      event.target.checked
    );

    $('#timestamp').checked = event.target.checked;
    updateOverlay();
  };

  $('#audioDefault').onchange = event => {
    settingSet(
      'usbCameraAudio',
      event.target.checked
    );
  };

  $('#motionDefault').onchange = event => {
    settingSet(
      'usbCameraMotion',
      event.target.checked
    );

    $('#motion').checked = event.target.checked;
    $('#motion').dispatchEvent(new Event('change'));
  };

  $('#resolutionDefault').onchange = event => {
    settingSet(
      'usbCameraResolution',
      event.target.value
    );

    $('#resolution').value = event.target.value;
    applyVideoSettings();
  };

  $('#frameRateDefault').onchange = event => {
    settingSet(
      'usbCameraFrameRate',
      event.target.value
    );

    $('#frameRate').value = event.target.value;
    applyVideoSettings();
  };

  $('#formatDefault').onchange = event => {
    settingSet(
      'usbCameraFormat',
      event.target.value
    );

    $('#format').value = event.target.value;
  };

  $('#qualityDefault').onchange = event => {
    settingSet(
      'usbCameraQuality',
      event.target.value
    );

    $('#quality').value = event.target.value;
  };

  [
    'brightness',
    'contrast',
    'saturation',
    'sharpness',
    'whiteBalance',
    'exposure'
  ].forEach(type => {
    $('#' + type + 'Range').oninput = event => {
      settingSet(
        'usbCamera' +
        type.charAt(0).toUpperCase() +
        type.slice(1),
        Number(event.target.value)
      );

      applyImageFilters();
    };
  });

  $('#antiAliasing').onchange = event => {
    settingSet(
      'usbCameraAntiAliasing',
      event.target.checked
    );

    applyImageFilters();
  };

  $('#antiAliasingLevel').onchange = event => {
    settingSet(
      'usbCameraAaLevel',
      event.target.value
    );

    applyImageFilters();
  };

  $('#resetSettings').onclick = () => {
    [
      'usbCameraTheme',
      'usbCameraSplash',
      'usbCameraReduceMotion',
      'usbCameraTimestamp',
      'usbCameraAudio',
      'usbCameraMotion',
      'usbCameraResolution',
      'usbCameraFrameRate',
      'usbCameraFormat',
      'usbCameraDateFolders',
      'usbCameraQuality',
      'usbCameraBrightness',
      'usbCameraContrast',
      'usbCameraSaturation',
      'usbCameraSharpness',
      'usbCameraWhiteBalance',
      'usbCameraExposure',
      'usbCameraAntiAliasing',
      'usbCameraAaLevel'
    ].forEach(key => {
      try {
        localStorage.removeItem(key);
      } catch(e) {}
    });

    location.reload();
  };

  $('#chooseFolder').onclick = async () => {
    if (window.Android && Android.chooseSaveFolder) {
      Android.chooseSaveFolder();
      return;
    }

    if (window.showDirectoryPicker) {
      try {
        browserDirectory = await window.showDirectoryPicker({
          mode:'readwrite'
        });

        updateFolderStatus();
        toast('Pasta de gravação autorizada no navegador.');
      } catch(e) {}
    } else {
      toast(
        'Este navegador não oferece escolha de pasta; use o download normal.'
      );
    }
  };

  $('#clearFolder').onclick = () => {
    if (window.Android && Android.clearSaveFolder) {
      Android.clearSaveFolder();
    }

    browserDirectory = null;
    updateFolderStatus();
    toast('Pasta escolhida removida.');
  };

  $('#dateFolders').onchange = event => {
    settingSet(
      'usbCameraDateFolders',
      event.target.checked
    );

    updateFolderStatus();
  };

  window.onSaveFolderChosen = selected => {
    updateFolderStatus();

    if (selected) {
      toast('Pasta de gravação autorizada.');
    }
  };

  loadSettings();
  updateFolderStatus();

  $('#streamBtn').onclick = () => {
    if (!$('#server').value) {
      return showError(
        'Informe o endereço do servidor antes de continuar.'
      );
    }

    toast(
      'Configuração salva. Um backend de transmissão é necessário para enviar o sinal.'
    );
  };

  updateOverlay();

  if (
    navigator.mediaDevices &&
    navigator.mediaDevices.enumerateDevices
  ) {
    listDevices();
  }
</script>
